[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "syslog-postmortem"
version = "1.0.0"
description = "Generate structured postmortem drafts from journalctl, syslog, auth.log and dmesg"
readme = "README.md"
license = "MIT"
authors = [{ name = "Sergio Berruetta" }]
requires-python = ">=3.8"
dependencies = ["shellcolorize"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
    "Topic :: System :: Logging",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage     = "https://github.com/serber-info/syslog-postmortem"
"Bug Tracker" = "https://github.com/serber-info/syslog-postmortem/issues"
"Source Code" = "https://github.com/serber-info/syslog-postmortem"

[project.scripts]
postmortem = "syslog_postmortem.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["syslog_postmortem*"]
